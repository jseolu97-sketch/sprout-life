<title>새싹 인생게임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 교실 창가 관찰일지. 위 HUD(주차·날씨·용돈·행동력), 왼쪽 화분 무대, 오른쪽 행동/상점/일지 탭. 모바일은 쌓임 */
:root{
  --bg:#EAF0E1; --surface:#F8FBF2; --stage:#DCE7CC; --ink:#1D2A20; --muted:#56675A; --line:#C3CFB4;
  --accent:#E8AF0B; --accent-ink:#2A2003; --leaf:#357A3B; --water:#2B78AE; --sun:#C9870A; --nutri:#8A5A2B;
  --danger:#BE4129; --event:#B0501A; --band:rgba(53,122,59,.22); --scrim:rgba(20,28,22,.55);
  --pot:#B4613C; --pot-rim:#C9734B; --soil:#4E3626; --stake:#A08257;
  --s-calm:#CFE3C2; --s-event:#F2B48C; --s-friend:#B7D6EE; --s-luck:#F6DA7A; --s-ink:#1D2A20;
  --display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121914; --surface:#1A231C; --stage:#1F2C21; --ink:#E4ECDA; --muted:#9AAA94; --line:#2F3D31;
  --accent:#F2C232; --accent-ink:#231A02; --leaf:#6DB46F; --water:#5AA7DA; --sun:#F0B43A; --nutri:#C99462;
  --danger:#E8705A; --event:#E8894E; --band:rgba(109,180,111,.24); --scrim:rgba(0,0,0,.65);
  --pot:#A7593A; --pot-rim:#BC6A48; --soil:#3A281C; --stake:#8C7148; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121914; --surface:#1A231C; --stage:#1F2C21; --ink:#E4ECDA; --muted:#9AAA94; --line:#2F3D31;
  --accent:#F2C232; --accent-ink:#231A02; --leaf:#6DB46F; --water:#5AA7DA; --sun:#F0B43A; --nutri:#C99462;
  --danger:#E8705A; --event:#E8894E; --band:rgba(109,180,111,.24); --scrim:rgba(0,0,0,.65);
  --pot:#A7593A; --pot-rim:#BC6A48; --soil:#3A281C; --stake:#8C7148; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.app{max-width:1100px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4,.display{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{font-size:.82rem;color:var(--muted)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.25rem;color:var(--leaf)}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.hud > div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;display:flex;align-items:center;gap:6px;font-size:.9rem;font-variant-numeric:tabular-nums}
.hud b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.hud svg{width:20px;height:20px;flex:none}
.ap{display:flex;gap:3px}
.ap i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.ap i.on{background:var(--accent)}

/* 시작 */
.intro{display:flex;flex-direction:column;gap:12px;max-width:64ch}
.intro h1{font-size:clamp(2rem,6vw,3.2rem)}
.intro p{color:var(--muted);font-size:1.05rem}
.features{display:flex;flex-wrap:wrap;gap:6px}
.features span{font-size:.82rem;padding:2px 10px;border-radius:999px;border:1.5px solid var(--line)}
.name-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.name-row label{font-family:var(--display)}
.name-row input{font:inherit;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:13em;max-width:100%}
.plants{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-3px);border-color:var(--leaf)}
.pcard .pic{background:var(--stage);border-radius:12px;display:flex;justify-content:center}
.pcard svg{height:130px;width:auto}
.nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.nm b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.lvl{font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:.75rem;padding:1px 7px;border-radius:6px;background:var(--bg)}
.achv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.achv div{border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;color:var(--muted)}
.achv div.got{border:1.5px solid var(--accent);color:var(--ink)}
.achv b{font-family:var(--display);font-weight:400;display:block}

/* 게임 */
.game{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:800px){.game{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--stage);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stage-head h2{font-size:1.45rem}
.plant-svg{display:flex;justify-content:center}
.plant-svg svg{width:100%;max-width:250px;height:auto}
.spotline{font-size:.88rem;color:var(--muted);text-align:center}
.stats{display:flex;flex-direction:column;gap:9px}
.stat-head{display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
.stat-head .lb{font-family:var(--display);min-width:2.8em}
.stat-head b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:400}
.chip{font-size:.72rem;padding:0 7px;border-radius:999px;border:1px solid currentColor;line-height:1.55;white-space:nowrap}
.chip.ok{color:var(--leaf)} .chip.bad{color:var(--danger)} .chip.mute{color:var(--muted)}
.meter{position:relative;height:10px;border-radius:6px;background:var(--line)}
.meter .band{position:absolute;top:-2px;bottom:-2px;background:var(--band);border-radius:4px;border:1.5px dashed var(--leaf)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;opacity:.55;transition:width .5s}
.meter .marker{position:absolute;top:-4px;width:5px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .5s}
.meter.unknown{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px)}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.conds span{font-size:.8rem;padding:2px 10px;border-radius:8px;border:1.5px solid var(--danger);color:var(--danger)}
.conds span.gear{border-color:var(--line);color:var(--ink)}
.goal{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.goal b{font-family:var(--display);font-weight:400;color:var(--event)}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.feed{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:4px;min-height:3.2em}
.feed h4{font-size:.95rem;color:var(--muted)}
.feed p:first-of-type{color:var(--ink)}
.feed p{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 14px;font-family:var(--display);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.act{text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.act:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.act b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.act small{line-height:1.4}
.act .cost{font-size:.75rem;color:var(--sun)}
.act:disabled{opacity:.55}
.act:disabled .cost{color:var(--danger)}
.act.special{border-color:var(--event)}
.shop{display:flex;flex-direction:column;gap:8px}
.shop .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg)}
.shop .row b{font-family:var(--display);font-weight:400}
.buy{border:1.5px solid var(--accent);background:transparent;border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy:disabled{border-color:var(--line);color:var(--muted)}
.journal{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto}
.journal section{border-left:3px solid var(--line);padding-left:12px}
.journal h4{font-size:1rem}
.journal ul{margin:4px 0 0;padding-left:18px;font-size:.9rem}
.panel-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 22px;font-family:var(--display);font-size:1.08rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.pulse{box-shadow:0 0 0 4px var(--band)}

/* 모달 */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:540px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;border:1.5px solid var(--line)}
.sheet.event{border-color:var(--event)}
.sheet h3{font-size:1.55rem}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{color:var(--event);border:1.5px solid var(--event);border-radius:999px;padding:0 8px;font-family:var(--display);letter-spacing:.02em}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);display:flex;gap:12px;align-items:center;transition:border-color .15s,transform .15s}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.choice:disabled{opacity:.55}
.choice .k{font-family:var(--display);width:1.8em;height:1.8em;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line)}
.choice span small{display:block}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lines li{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:.93rem}
.lines li.bad{border-left:4px solid var(--danger)}
.lines li.good{border-left:4px solid var(--leaf)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.deltas span{font-size:.85rem;padding:2px 10px;border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.deltas .up{color:var(--leaf)} .deltas .down{color:var(--danger)}
.tip{background:var(--stage);border-radius:12px;padding:10px 14px;font-size:.92rem}
.tip b{font-family:var(--display);font-weight:400;color:var(--leaf);margin-right:6px}
.wheel-wrap{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%;margin:6px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);position:relative;transition:transform 2.6s cubic-bezier(.15,.7,.2,1)}
.wheel span{position:absolute;font-family:var(--display);font-size:.88rem;color:var(--s-ink);white-space:nowrap}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--ink);z-index:1}
.paths{display:flex;flex-direction:column;gap:10px}
.path{text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:4px}
.path:hover{border-color:var(--event)}
.path b{font-family:var(--display);font-weight:400;font-size:1.2rem}

/* 결말 */
.end{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:800px){.end{grid-template-columns:minmax(0,1fr)}}
.verdict{display:flex;flex-direction:column;gap:12px}
.verdict h2{font-size:clamp(1.8rem,5vw,2.6rem)}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.summary div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 14px}
.summary small{display:block}
.summary b{font-family:var(--display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums}
.rowb{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <span class="brand">새싹 인생게임</span>
    <div class="hud" id="hud" hidden></div>
  </header>

  <section id="pick">
    <div class="intro">
      <h1>12주, 내 식물의 인생</h1>
      <p>식물 하나를 골라 교실에서 12주 동안 키워요. 매주 행동력 3을 어디에 쓸지 직접 정하고, 용돈으로 도구를 사고, 날씨 예보를 보고 대비하세요. 룰렛이 돌아가면 무슨 일이 생길지 아무도 몰라요.</p>
      <div class="features"><span>행동 11가지</span><span>상점과 용돈</span><span>날씨 예보</span><span>운명의 룰렛</span><span>4주차 인생 갈림길</span><span>숨은 병충해</span><span>엔딩과 업적</span></div>
      <div class="name-row"><label for="petname">식물 이름</label><input id="petname" maxlength="10" placeholder="비워 두면 자동으로 지어요"></div>
    </div>
    <div class="plants" id="plants" style="margin-top:18px"></div>
    <h2 style="margin-top:28px;font-size:1.4rem">모은 업적</h2>
    <div class="achv" id="achv" style="margin-top:10px"></div>
  </section>

  <section id="game" class="game" hidden>
    <div class="stage" id="stage"></div>
    <div class="panel">
      <div class="feed" id="feed" aria-live="polite"></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="act" aria-selected="true">행동</button>
        <button role="tab" data-tab="shop" aria-selected="false">상점</button>
        <button role="tab" data-tab="log" aria-selected="false">관찰일지</button>
      </div>
      <div id="tabbody"></div>
      <div class="panel-foot"><small id="aphint"></small><button class="btn" id="endweek" data-endweek>이번 주 마치기</button></div>
    </div>
  </section>

  <section id="end" class="end" hidden></section>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// ================= 데이터 =================
const WEEKS = 12;
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const mid = r => (r[0] + r[1]) / 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FLOWERING = new Set(['tomato', 'sunflower', 'bean']);
const STAT = { water: '물', light: '빛', nutri: '양분', health: '건강', growth: '성장' };

const PLANTS = {
  tomato: { name: '방울토마토', pet: '토토', lvl: '어려움', desc: '햇빛과 양분을 듬뿍 먹고 빨간 열매를 맺어요.',
    tags: ['햇빛 많이', '물 넉넉히', '비료 많이'], thirst: 18, speed: 1,
    ideal: { water: [50, 80], light: [60, 95], nutri: [45, 90] }, stages: ['꽃이 핀 시기', '열매가 익는 시기'], goal: '빨간 방울토마토가 주렁주렁 열렸어요',
    hints: { water: ['토마토는 물이 모자라면 잎이 처지고 꽃이 떨어져요.', '물이 넘치면 뿌리가 숨을 못 쉬고 열매가 갈라져요.'],
      light: ['토마토는 하루 6시간 넘게 햇빛을 받아야 열매를 맺어요.', '햇빛이 너무 강하면 잎이 하얗게 탈 수 있어요.'],
      nutri: ['열매를 키우려면 양분이 많이 필요해요.', '양분이 지나치면 잎만 무성해지고 열매는 줄어요.'] },
    facts: ['토마토는 원래 남아메리카 안데스 산맥에서 온 식물이에요.', '토마토 꽃은 바람에 흔들리기만 해도 스스로 꽃가루받이를 할 수 있어요.'] },
  sunflower: { name: '해바라기', pet: '해바라', lvl: '보통', desc: '해를 향해 쑥쑥, 얼굴만 한 꽃을 피워요.',
    tags: ['햇빛 아주 많이', '물 넉넉히', '비료 보통'], thirst: 16, speed: 1,
    ideal: { water: [45, 80], light: [70, 100], nutri: [35, 80] }, stages: ['꽃봉오리가 생김', '꽃이 활짝 핌'], goal: '얼굴만 한 해바라기 꽃이 활짝 피었어요',
    hints: { water: ['해바라기는 키가 크는 만큼 물을 많이 마셔요.', '흙이 늘 젖어 있으면 줄기 밑동이 물러져요.'],
      light: ['빛이 부족하면 줄기가 가늘고 길게 웃자라요.', '햇빛이 너무 강해서 잎이 탈 수 있어요.'],
      nutri: ['큰 꽃을 피우려면 양분이 더 필요해요.', '비료가 너무 많으면 줄기가 약해져 쓰러지기 쉬워요.'] },
    facts: ['어린 해바라기는 낮 동안 해를 따라 고개를 돌리지만, 꽃이 피면 대부분 동쪽을 향해 멈춰요.', '해바라기 꽃 한 송이는 사실 작은 꽃 수백 개가 모인 거예요.'] },
  lettuce: { name: '상추', pet: '상추쌈', lvl: '보통', desc: '시원하고 촉촉한 걸 좋아하는 잎채소예요.',

function newGame(k, pet) {
  const p = PLANTS[k];
  const s = { k, p, pet, week: 1, ap: 3, coins: 8, water: Math.round(mid(p.ideal.water) + 5), nutri: 50, health: 80, growth: 0,
    spot: 'center', potBig: false, staked: false, wick: false, lamp: false, items: { fert: 0, compost: 0, stake: 0, pot: 0, spray: 0 },
    aphid: 0, mildew: 0, rot: 0, known: { aphid: false, mildew: false }, bands: { water: false, light: false, nutri: false },
    measured: null, checkedWeek: 0, knowledge: 0, friends: 0, contest: 0, path: null, pruned: false, treated: false,
    weather: 'sun', forecast: 'sun', usedEvents: [], log: [], cur: [],
    stats: { waterOk: 0, pests: 0, typhoon: 0, typhoonHit: 0, low: 80, bandsWeek: 0 } };
  s.forecast = rollWeather(s, 2);
  return s;
}
function rollWeather(s, wk) {
  const pool = Object.entries(WEATHER).filter(([k]) => k !== 'typhoon' || (wk >= 4 && wk < WEEKS && !s.stats.typhoon));
  let r = Math.random() * pool.reduce((a, [, v]) => a + v.w, 0);
  for (const [k, v] of pool) if ((r -= v.w) < 0) return k;
  return 'sun';
}
const lightOf = s => clamp(Math.round(SPOTS[s.spot].light + WEATHER[s.weather].light * SPOTS[s.spot].f + (s.lamp ? 20 : 0)));
const note = (s, t) => { s.cur.push(t); return t; };

function beginWeek(s) {
  s.weather = s.forecast === 'typhoon' || Math.random() < .8 ? s.forecast : rollWeather(s, s.week); // 예보는 80% 정확, 태풍 예보는 항상 정확
  if (s.weather === 'typhoon') s.stats.typhoon = 1;
  s.forecast = rollWeather(s, s.week + 1);
  s.ap = 3; s.coins += 2; s.pruned = false; s.treated = false; s.cur = [];
}

function endWeek(s) {
  const p = s.p, W = WEATHER[s.weather], sp = SPOTS[s.spot], lines = [], before = { water: s.water, nutri: s.nutri, health: s.health, growth: s.growth };
  let dh = 0;
  let mult = W.decay * (s.potBig ? .85 : 1) * (s.weather === 'heat' && sp.hot ? 1.2 : 1);
  s.water = clamp(s.water - p.thirst * mult);
  if (sp.outdoor && W.rain) { s.water = clamp(s.water + W.rain); lines.push(['창밖 화분이 비를 흠뻑 맞았어요.', '']); }
  if (s.wick && s.water < p.ideal.water[0]) { s.water = p.ideal.water[0]; lines.push(['심지 급수기가 마른 흙에 물을 보충했어요.', 'good']); }
  s.nutri = clamp(s.nutri - 5);
  const light = lightOf(s);
  if (s.weather === 'typhoon') {
    if (!sp.outdoor) lines.push(['태풍이 지나갔지만 교실 안이라 안전했어요.', 'good']);
    else if (s.staked) { dh -= 5; lines.push(['태풍이 몰아쳤지만 지지대와 끈 덕분에 버텼어요.', 'good']); }
    else { dh -= 25; s.growth = clamp(s.growth - 8); s.stats.typhoonHit++; lines.push(['태풍에 줄기가 꺾이고 잎이 찢어졌어요!', 'bad']); }
  }
  // 숨은 병충해: 관찰하지 않으면 심해질 때까지 모를 수 있음
  if (s.aphid > 0) { if (!s.treated) s.aphid = Math.min(4, s.aphid + 1); }
  else if (Math.random() < .06 + (sp.outdoor ? .12 : 0) + (s.nutri > 70 ? .08 : 0)) s.aphid = 1;
  const humid = ['rain', 'cloud', 'typhoon'].includes(s.weather) || s.water > 75;
  if (s.mildew > 0) { if (humid && !s.pruned) s.mildew = Math.min(4, s.mildew + 1); }
  else if (humid && s.water > 60 && !s.pruned && Math.random() < .2) s.mildew = 1;
  s.rot = s.water > p.ideal.water[1] + 10 ? s.rot + 1 : Math.max(0, s.rot - 1);
  if (s.aphid >= 3 && !s.known.aphid) { s.known.aphid = true; lines.push(['새순에 벌레가 우글우글한 게 눈에 띄어요!', 'bad']); }
  if (s.mildew >= 3 && !s.known.mildew) { s.known.mildew = true; lines.push(['잎이 하얀 가루로 덮이기 시작했어요!', 'bad']); }
  // 환경이 맞는지에 따라 건강 변화. 증상은 원인을 바로 알려 주지 않음 (가뭄과 과습은 둘 다 잎이 처짐)
  const symptom = { water: ['잎이 축 처졌어요.', '잎이 처지고 흙에서 퀴퀴한 냄새가 나요.'], light: ['줄기가 창 쪽으로 휘고 가늘게 웃자라요.', '잎 가장자리가 하얗게 탔어요.'], nutri: ['아래쪽 잎이 연노랗게 변했어요.', '잎 끝이 갈색으로 타들어 가요.'] };
  const vals = { water: s.water, light, nutri: s.nutri };
  let ok = 0;
  for (const key of ['water', 'light', 'nutri']) {
    const [lo, hi] = p.ideal[key], v = vals[key];
    if (v < lo) { dh -= Math.min(12, Math.ceil((lo - v) / 3)); lines.push([symptom[key][0], 'bad']); }
    else if (v > hi) { dh -= Math.min(12, Math.ceil((v - hi) / 3)); lines.push([symptom[key][1], 'bad']); }
    else { dh += 3; ok++; if (key === 'water') s.stats.waterOk++; }
  }
  if (ok === 3) lines.push(['물, 빛, 양분이 모두 딱 맞았는지 잎이 반짝반짝해요.', 'good']);
  dh -= 3 * s.aphid + 3 * s.mildew + (s.rot >= 2 ? 6 : 0);
  s.health = clamp(s.health + dh);
  const g = s.health >= 70 ? 9 : s.health >= 45 ? 6 : s.health >= 25 ? 2 : 0;
  s.growth = clamp(s.growth + (g + (s.potBig && g ? 1 : 0)) * p.speed);
  s.stats.low = Math.min(s.stats.low, s.health);
  s.log.push({ week: s.week, weather: s.weather, entries: [...s.cur, ...lines.map(l => l[0])] });
  const res = { week: s.week, weather: s.weather, lines, before };
  s.week++;
  return res;
}

function pest(s, n, txt) {
  const had = s.aphid; s.aphid = Math.max(0, s.aphid - n); s.treated = true;
  if (had && !s.aphid) { s.stats.pests++; s.known.aphid = false; }
  return txt + (!had ? ' 그런데 벌레가 없었어요.' : s.aphid ? ' 아직 조금 남았어요.' : ' 진딧물이 모두 사라졌어요!');
}
function revealBand(s) {
  const k = ['water', 'light', 'nutri'].find(x => !s.bands[x]); if (!k) return '';
  s.bands[k] = true;
  if (!s.stats.bandsWeek && ['water', 'light', 'nutri'].every(x => s.bands[x])) s.stats.bandsWeek = s.week;
  const [lo, hi] = s.p.ideal[k];
  return `${s.p.name}는 ${STAT[k]} ${lo}~${hi} 사이를 좋아한대요. 화면에 점선 칸으로 표시했어요.`;
}
function check(s) {
  const p = s.p;
  s.measured = { week: s.week, water: Math.round(s.water), nutri: Math.round(s.nutri) };
  if (s.checkedWeek !== s.week) { s.knowledge++; s.checkedWeek = s.week; }
  const out = [`흙 수분 ${s.measured.water}, 양분 ${s.measured.nutri}을(를) 기록했어요.`];
  const vals = { water: s.water, light: lightOf(s), nutri: s.nutri };
  for (const k of ['water', 'light', 'nutri']) if (s.bands[k]) {
    const [lo, hi] = p.ideal[k];
    if (vals[k] < lo) out.push(p.hints[k][0]); else if (vals[k] > hi) out.push(p.hints[k][1]);
  }
  if (!s.bands.water || !s.bands.nutri) out.push('이 수치가 알맞은지는 도서관에서 조사해야 알 수 있어요.');
  if (s.aphid) { s.known.aphid = true; out.push('잎 뒷면에 진딧물이 붙어 있어요!'); }
  if (s.mildew) { s.known.mildew = true; out.push('잎에 하얀 가루(흰가루병)가 보여요.'); }
  if (s.rot >= 2) out.push('흙에서 썩은 냄새가 나요. 뿌리가 상하고 있어요. 물을 줄여야 해요.');
  if (!s.aphid && !s.mildew && s.rot < 2) out.push('벌레나 병은 보이지 않아요.');
  return out.join(' ');
}

function actionsFor(s) {
  const list = ACTIONS.slice();
  if (s.path) list.push({ id: 'path', name: PATHS[s.path].act, desc: PATHS[s.path].actDesc, special: true,
    need: s => s.path === 'market' && s.growth < 40 ? '성장 40% 이후 가능해요' : '', run: PATH_RUN[s.path] });
  return list;
}
function doAction(s, a, opt) {
  if (s.ap < 1) return null;
  s.ap--;
  return note(s, `${a.name}: ${(opt || a).run(s)}`);
}
function buy(s, id) {
  const it = ITEMS[id]; if (s.coins < it.price || (it.once && s[id])) return null;
  s.coins -= it.price;
  if (it.once) s[id] = true; else s.items[id] += it.add;
  return note(s, `상점: ${it.name}을(를) 샀어요.${it.once ? ' 바로 설치했어요.' : ''}`);
}

function drawEvent(s, type) {
  const pool = (type === 'friend' ? FRIEND_EVENTS : EVENTS).filter(e => !s.usedEvents.includes(e.id) && (!e.cond || e.cond(s)));
  const e = pool.length ? pick(pool) : null;

function ending(s) {

function tint(h, hue = 120) { const t = h / 100; return { leaf: `hsl(${Math.round(40 + t * (hue - 40))} ${Math.round(42 + t * 18)}% ${Math.round(48 - t * 12)}%)`, stem: `hsl(${Math.round(40 + t * (hue - 40))} ${Math.round(38 + t * 14)}% ${Math.round(34 - t * 6)}%)` }; }
function E(cx, cy, rx, ry, rot, fill) { return `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${fill}"/>`; }
function leaf(x, y, len, ang, fill, wide = 4.2) { const r = ang * Math.PI / 180; return E(x + Math.cos(r) * len / 2, y + Math.sin(r) * len / 2, len / 2, len / wide, ang, fill); }
const C = (x, y, r, f) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${f}"/>`;
const stake = x => `<line x1="${x}" y1="182" x2="${x}" y2="34" stroke="var(--stake)" stroke-width="3" stroke-linecap="round"/>`;
const POT = '<path d="M66 186 L134 186 L127 232 L73 232 Z" fill="var(--pot)"/><rect x="60" y="176" width="80" height="13" rx="3" fill="var(--pot-rim)"/><ellipse cx="100" cy="178" rx="36" ry="3.5" fill="var(--soil)"/>';

function drawPlant(k, g, h, o = {}) {
  const d = h < 30 ? 38 : h < 55 ? 16 : 0;
  const R = a => -25 + d + a, L = a => 205 - d - a;
  let s = '';
  if (g < 8 && FLOWERING.has(k)) {
    const { leaf: lc, stem } = tint(h); const top = 176 - (6 + g * 2);
    s += `<path d="M100 178 L100 ${top}" stroke="${stem}" stroke-width="3" stroke-linecap="round"/>` + leaf(100, top, 10, R(-10), lc, 2.6) + leaf(100, top, 10, L(-10), lc, 2.6);
  } else if (k === 'tomato') {
    const { leaf: lc, stem } = tint(h); const H = 18 + g * 1.25, top = 178 - H;
    if (o.staked) s += stake(120);
    s += `<path d="M100 178 Q94 ${178 - H / 2} 100 ${top}" stroke="${stem}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    const n = 1 + Math.floor(g / 11), len = 16 + g * .12;
    for (let i = 0; i < n; i++) { const y = 178 - H * (i + 1) / (n + 1); s += leaf(97, y, len, i % 2 ? L(0) : R(0), lc); }
    s += leaf(100, top, 11, R(-30), lc) + leaf(100, top, 11, L(-30), lc);
    if (g >= 55) [[-15, 22], [13, 36], [-9, 52]].forEach(([dx, dy]) => s += C(100 + dx, top + dy, 3.2, '#F0C21E'));
    if (g >= 72) {
      const n2 = Math.min(9, 1 + Math.floor((g - 72) / 3.2)), col = h > 40 ? (g >= 88 ? '#D8352A' : '#E8862C') : '#9A6B3B';
      const spots = [[88, 40], [113, 58], [91, 80]];
      for (let i = 0; i < n2; i++) { const [cx, cy] = spots[i % 3], j = Math.floor(i / 3); s += C(cx + (j - 1) * 9, top + cy + (j % 2) * 9 + d / 3, 6, col); }
    }
  } else if (k === 'sunflower') {
    const { leaf: lc, stem } = tint(h); const H = 20 + g * 1.15, top = 178 - H;
    if (o.staked) s += stake(112);
    s += `<path d="M100 178 L100 ${top}" stroke="${stem}" stroke-width="6" stroke-linecap="round"/>`;
    const n = 1 + Math.floor(g / 14), len = 22 + g * .18;
    for (let i = 0; i < n; i++) { const y = 178 - (H - 10) * (i + 1) / (n + 1); s += leaf(100, y, len, i % 2 ? L(5) : R(5), lc, 2.8); }
    if (g >= 55 && g < 78) s += C(100, top, 7, stem);
    if (g >= 78) {
      const r = 9 + (g - 78) * .6, pc = h > 40 ? '#F2BE22' : '#C4A04C', cy = top + d / 2;
      for (let i = 0; i < 16; i++) { const a = i * 22.5, rr = a * Math.PI / 180; s += E(100 + Math.cos(rr) * (r + 7), cy + Math.sin(rr) * (r + 7), 9, 3.8, a, pc); }
      s += C(100, cy, r, '#6A4324');
    }
  } else if (k === 'lettuce') {
    const n = 3 + Math.floor(g / 9), L0 = 14 + g * .48;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), ang = -165 + 150 * t, len = L0 * (1 - .32 * Math.abs(ang + 90) / 75) * (i % 2 ? .85 : 1);
      s += leaf(100, 176, len, ang + (ang < -90 ? -d / 2 : d / 2), tint(clamp(h + (i % 2 ? 8 : -4)), 105).leaf, 2.5);
    }
  } else if (k === 'succulent') {
    const sc = .35 + g / 100 * .75;
    if (g >= 85) s += `<path d="M104 160 Q118 120 128 96" stroke="${tint(h, 150).stem}" stroke-width="2.5" fill="none"/>` + C(128, 94, 4, '#EE8A3A') + C(124, 103, 3.4, '#EE8A3A') + C(120, 112, 3, '#EE8A3A');
    [[7, 36, -6], [6, 26, 6], [4, 16, 14]].forEach(([n, l, light], layer) => {
      for (let i = 0; i < n; i++) {
        const ang = -168 + 156 * i / (n - 1) + (layer ? 6 : 0), len = l * sc, w = len * .38;
        s += `<path d="M0 0 Q${(len * .45).toFixed(1)} ${(-w).toFixed(1)} ${len.toFixed(1)} 0 Q${(len * .45).toFixed(1)} ${w.toFixed(1)} 0 0Z" transform="translate(100 ${(174 - layer * 3 * sc).toFixed(1)}) rotate(${(ang + (ang < -90 ? -d / 3 : d / 3)).toFixed(1)})" fill="${tint(clamp(h + light), 155).leaf}"/>`;
      }
    });
  } else if (k === 'bean') {
    const { leaf: lc, stem } = tint(h); const H = (o.staked ? 18 : 14) + g * (o.staked ? 1.3 : .9), top = 178 - H;
    if (o.staked) s += stake(100);
    let path = 'M100 178';
    for (let y = 172; y >= top; y -= 6) path += ` L${(100 + Math.sin((178 - y) / 9) * 7).toFixed(1)} ${y}`;
    s += `<path d="${path}" stroke="${stem}" stroke-width="2.6" fill="none" stroke-linejoin="round"/>`;
    const n = 1 + Math.floor(g / 12), len = 13 + g * .1;
    for (let i = 0; i < n; i++) {
      const y = 178 - H * (i + 1) / (n + 1), x = 100 + Math.sin((178 - y) / 9) * 7, a = i % 2 ? L(0) : R(0);
      s += leaf(x, y, len, a, lc, 2.4) + leaf(x, y, len * .8, a - 35, lc, 2.4) + leaf(x, y, len * .8, a + 35, lc, 2.4);
    }
    if (g >= 55) [[-12, 30], [12, 48], [-10, 70]].forEach(([dx, dy]) => s += C(100 + dx, Math.min(170, top + dy), 3, '#F3D3E2'));
    if (g >= 74) {
      const n2 = Math.min(6, 1 + Math.floor((g - 74) / 4.5)), pc = h > 40 ? '#7FAE4E' : '#A99A5C';
      for (let i = 0; i < n2; i++) { const side = i % 2 ? -1 : 1; s += E(100 + side * 16, Math.min(165, top + 40 + i * 13), 3.6, 13, side * 18, pc); }
    }
  }
  // 눈으로 보이는 단서: 심해진 진딧물(작은 점), 흰가루병(하얀 얼룩)
  const top = 172 - Math.max(30, g * (k === 'lettuce' || k === 'succulent' ? .5 : 1.1));
  for (let i = 0; i < (o.aphid >= 2 ? o.aphid * 4 : 0); i++) s += C(100 + Math.sin(i * 2.4) * 22, top + 8 + ((i * 37) % 45), 1.8, '#6F9A2C');
  for (let i = 0; i < (o.mildew >= 2 ? o.mildew * 3 : 0); i++) s += C(100 + Math.cos(i * 1.9) * 24, top + 12 + ((i * 29) % 50), 2.6, 'rgba(255,255,255,.85)');
  return `<svg viewBox="0 0 200 236" role="img" aria-label="${PLANTS[k].name} 그림">${s}${POT}</svg>`;
}
function wIcon(k) {

          <div class="meter"><span class="fill" style="width:${h}%;background:${hc};opacity:.9"></span></div></div>
        <div class="stat"><div class="stat-head"><span class="lb">성장</span><b>${Math.round(s.growth)}%</b></div>
          <div class="meter"><span class="fill" style="width:${s.growth}%;background:var(--leaf);opacity:.9"></span></div></div>
        ${meter('light', lightOf(s), 'var(--sun)', '예상')}
        ${meter('water', m && m.water, 'var(--water)', ago)}
        ${meter('nutri', m && m.nutri, 'var(--nutri)', ago)}
      </div>
      ${conds.length || gear.length || inv.length ? `<div class="conds">${conds.join('')}${gear.join('')}${inv.join('')}</div>` : ''}
      ${path ? `<div class="goal"><b>${path.name}</b><span>${path.goal}</span><small>${prog}</small></div>` : '<small>물과 양분은 관찰해야 정확히 알 수 있어요. 빗금 막대는 아직 모르는 값이에요.</small>'}`;
  }

  function renderFeed() {
    const c = G.cur.slice().reverse().slice(0, 3);
    $('feed').innerHTML = `<h4>${G.week}주차에 한 일</h4>` + (c.length ? c.map(t => `<p>${esc(t)}</p>`).join('') : '<p>행동력 3을 어디에 쓸지 골라 보세요. 상점은 행동력이 들지 않아요.</p>');
  }

  function renderTab() {
    const s = G;
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    if (tab === 'act') {
      $('tabbody').innerHTML = `<div class="acts">${actionsFor(s).map(a => {
        const why = s.ap < 1 ? '행동력이 없어요' : a.need ? a.need(s) : '';
        return `<button class="act${a.special ? ' special' : ''}" data-act="${a.id}" ${why ? 'disabled' : ''}><b>${a.name}</b><small>${a.desc}</small><span class="cost">${why || '행동력 1'}</span></button>`;
      }).join('')}</div>`;
    } else if (tab === 'shop') {
      $('tabbody').innerHTML = `<div class="shop">${Object.entries(ITEMS).map(([k, it]) => {
        const owned = it.once ? s[k] : 0, dis = owned || s.coins < it.price;
        return `<div class="row"><div><b>${it.name}</b><br><small>${it.desc}${!it.once && s.items[k] ? ` 보유 ${s.items[k]}` : ''}</small></div>
          <button class="buy" data-buy="${k}" ${dis ? 'disabled' : ''}>${owned ? '설치됨' : `용돈 ${it.price}`}</button></div>`;
      }).join('')}</div>`;
    } else {
      const weeks = [{ week: s.week, weather: s.weather, entries: s.cur, now: true }, ...s.log.slice().reverse()];
      $('tabbody').innerHTML = `<div class="journal">${weeks.map(w => `<section><h4>${w.week}주차 · ${WEATHER[w.weather].name}${w.now ? ' (지금)' : ''}</h4><ul>${w.entries.length ? w.entries.map(t => `<li>${esc(t)}</li>`).join('') : '<li>아직 기록이 없어요.</li>'}</ul></section>`).join('')}</div>`;
    }
    $('aphint').textContent = s.ap ? `행동력 ${s.ap} 남음` : '이번 주 행동을 모두 했어요';
    $('endweek').classList.toggle('pulse', !s.ap);
  }

  const renderAll = () => { renderHud(); renderStage(); renderFeed(); renderTab(); };

  // ---- 모달 ----
  let onModal = {};
  function modal(html, cls = '', handlers = {}) {
    $('sheet').className = 'sheet ' + cls; $('sheet').innerHTML = html; $('modal').hidden = false; onModal = handlers;
    const f = $('sheet').querySelector('button:not(:disabled)'); if (f) f.focus();
  }
  const closeModal = () => { $('modal').hidden = true; onModal = {}; renderAll(); };

  function showOptions(a) {
    const opts = a.opts(G);
    modal(`<div class="eyebrow">행동력 1</div><h3>${a.name}</h3><div class="choices">${opts.map((o, i) => {
      const why = o.need ? o.need(G) : '';
      return `<button class="choice" data-m="${i}" ${why ? 'disabled' : ''}><span class="k">${'가나다라'[i]}</span><span>${o.label}<small>${why || o.sub || ''}</small></span></button>`;
    }).join('')}</div><button class="btn ghost" data-m="x">취소</button>`, '', {
      pick: i => { doAction(G, a, opts[i]); closeModal(); } });
  }

  function showCard(e, kind) {
    modal(`<div class="eyebrow"><span>${G.week}주차</span><span class="pill">${kind}</span></div><h3>${e.title}</h3><p>${e.text}</p>
      <div class="choices">${e.choices.map((c, i) => { const why = c.need ? c.need(G) : '';
        return `<button class="choice" data-m="${i}" ${why ? 'disabled' : ''}><span class="k">${'가나다'[i]}</span><span>${c.label}${why ? `<small>${why}</small>` : ''}</span></button>`; }).join('')}</div>`, 'event', {
      pick: i => { const r = e.choices[i].run(G); note(G, `${e.title}: ${r}`);
        modal(`<div class="eyebrow"><span>${kind} 결과</span></div><h3>${esc(r)}</h3><p class="tip"><b>과학 메모</b>${e.tip}</p><button class="btn" data-m="x">계속하기</button>`, '', {}); } });
  }

  function showInfo(eyebrow, title, body) {
    modal(`<div class="eyebrow"><span class="pill">${eyebrow}</span></div><h3>${title}</h3>${body}<button class="btn" data-m="x">시작하기</button>`, '', {});
  }

  function showRoulette() {
    const step = 360 / SLICES.length, col = { calm: 'var(--s-calm)', event: 'var(--s-event)', friend: 'var(--s-friend)', luck: 'var(--s-luck)' };
    const grad = SLICES.map((t, i) => `${col[t]} ${i * step}deg ${(i + 1) * step}deg`).join(',');
    const labels = SLICES.map((t, i) => { const a = (i + .5) * step, r = a * Math.PI / 180;
      return `<span style="left:${50 + Math.sin(r) * 33}%;top:${50 - Math.cos(r) * 33}%;transform:translate(-50%,-50%) rotate(${a}deg)">${{ calm: '평온', event: '돌발', friend: '친구', luck: '행운' }[t]}</span>`; }).join('');
    modal(`<div class="eyebrow"><span>${G.week}주차 시작</span><span>용돈 +2</span></div><h3>운명의 룰렛</h3>
      <p>이번 주엔 무슨 일이 생길까요? 날씨는 <b>${WEATHER[G.weather].name}</b>이에요.</p>
      <div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel" style="background:conic-gradient(${grad})">${labels}</div></div>
      <button class="btn" data-m="spin" style="align-self:center">룰렛 돌리기</button>`, '', {
      spin: () => {
        const i = Math.floor(Math.random() * SLICES.length), type = SLICES[i];
        $('sheet').querySelector('[data-m="spin"]').disabled = true;
        $('wheel').style.transform = `rotate(${360 * 5 - (i + .5) * step}deg)`;
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(() => resolveSlice(type), reduce ? 50 : 2700);
      } });
  }

  function resolveSlice(type) {
    if (type === 'event' || type === 'friend') {
      const e = drawEvent(G, type);
      if (e) return showCard(e, type === 'event' ? '돌발 사건' : '친구 사건');
      type = 'calm';
    }
    const msg = type === 'luck' ? note(G, '행운: ' + pick(LUCK)(G)) : '평온한 한 주예요. 계획대로 차근차근 돌볼 수 있어요.';
    modal(`<div class="eyebrow"><span class="pill">${SLICE_NAME[type]}</span></div><h3>${esc(msg.replace(/^행운: /, ''))}</h3><button class="btn" data-m="x">좋아요</button>`, '', {});
  }

  function showPath() {
    modal(`<div class="eyebrow"><span>4주차</span><span class="pill">인생 갈림길</span></div><h3>이제 어떤 길을 걸을까요?</h3>
      <p>선생님이 학기 말 행사 세 가지를 알려 주셨어요. 하나를 고르면 그 길만의 특별 행동이 생기고, 엔딩이 달라져요.</p>
      <div class="paths">${Object.entries(PATHS).map(([k, p]) => `<button class="path" data-m="${k}"><b>${p.name}</b><small>목표: ${p.goal}</small><small>특별 행동: ${p.act}</small></button>`).join('')}</div>`, 'event', {
      pick: k => { G.path = k; note(G, `인생 갈림길: ${PATHS[k].name}의 길을 골랐어요.`); closeModal(); } });
  }

  function showMidterm() {
    const s = G, good = s.health >= 60;
    if (good) s.coins += 3;
    const msg = good ? '"아주 잘 키우고 있구나!" 선생님이 칭찬 용돈 3을 주셨어요.' : '"잎 색이 조금 걱정되는구나. 흙을 자주 관찰해 보렴."';
    note(s, '중간 점검: ' + msg);
    modal(`<div class="eyebrow"><span>8주차</span><span class="pill">중간 점검</span></div><h3>선생님의 중간 점검</h3><p>${msg}</p>
      <p class="tip"><b>남은 4주</b>${PATHS[s.path].goal}</p><button class="btn" data-m="x">힘내기</button>`, '', {});
  }

  function showSummary(res) {
    const s = G, b = res.before;
    const deltas = ['health', 'growth'].map(k => { const dv = Math.round(s[k] - b[k]); return `<span class="${dv >= 0 ? 'up' : 'down'}">${STAT[k]} ${dv >= 0 ? '+' : ''}${dv}</span>`; }).join('');
    const dead = s.health <= 0, last = s.week > WEEKS;
    modal(`<div class="eyebrow"><span>${res.week}주차가 지났어요</span><span>${WEATHER[res.weather].name}</span></div>
      <div class="plant-svg" style="max-width:150px;margin:auto">${drawPlant(s.k, s.growth, s.health, s)}</div>
      <h3>${dead ? `${esc(s.pet)}가 시들어 버렸어요` : `${esc(s.pet)}의 일주일`}</h3>
      <div class="deltas">${deltas}</div>
      <ul class="lines">${res.lines.map(([t, c]) => `<li class="${c}">${t}</li>`).join('') || '<li>조용히 자랐어요.</li>'}</ul>
      <small>증상만 보고는 원인을 확실히 알 수 없어요. 처진 잎은 물이 부족해도, 너무 많아도 생겨요. 흙을 관찰해 보세요.</small>
      <button class="btn" data-m="next">${dead || last ? '결말 보기' : `${s.week}주차로`}</button>`, '', { next: nextWeek });
  }

  function nextWeek() {
    if (G.health <= 0 || G.week > WEEKS) return finish();
    beginWeek(G);
    $('modal').hidden = true; renderAll();
    if (G.week === 4) showPath(); else if (G.week === 8) showMidterm(); else showRoulette();
  }

  function finish() {
    const s = G, e = ending(s), data = store.get(), fresh = [];
    if (!e.dead && s.growth >= 85 && !data.grown.includes(s.k)) data.grown.push(s.k);
    for (const a of ACHV) {
      const ok = a.id === 'gardener' ? data.grown.length >= 5 : a.test(s, e);
      if (ok && !data.got.includes(a.id)) { data.got.push(a.id); fresh.push(a); }
    }
    store.set(data);
    $('modal').hidden = true; $('game').hidden = true; $('hud').hidden = true; $('end').hidden = false;
    $('end').innerHTML = `
      <div class="stage"><div class="plant-svg">${drawPlant(s.k, e.g, e.dead ? 0 : e.h, s)}</div></div>
      <div class="verdict">
        <span class="eyebrow">${esc(s.pet)} · ${s.p.name} · ${PATHS[s.path || 'contest'].name}${e.dead ? ` · ${s.week - 1}주차에서 멈춤` : ' · 12주 완주'}</span>
        <h2>${e.title}</h2>
        <p>${esc(e.plant)} ${esc(e.line)}</p>
        <div class="summary"><div><small>성장</small><b>${e.g}%</b></div><div><small>건강</small><b>${e.h}</b></div><div><small>지식</small><b>${s.knowledge}</b></div><div><small>친구</small><b>${s.friends}</b></div><div><small>용돈</small><b>${s.coins}</b></div></div>
        ${fresh.length ? `<div class="achv">${fresh.map(a => `<div class="got"><b>새 업적: ${a.name}</b><small>${a.desc}</small></div>`).join('')}</div>` : ''}
        <h3>관찰일지</h3>
        <div class="journal">${s.log.slice().reverse().map(w => `<section><h4>${w.week}주차 · ${WEATHER[w.weather].name}</h4><ul>${w.entries.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>`).join('')}</div>
        <div class="rowb"><button class="btn" data-again>${s.p.name} 다시 키우기</button><button class="btn ghost" data-home>다른 식물 고르기</button></div>
      </div>`;
    window.scrollTo({ top: 0 });
  }

  function start(k) {
    G = newGame(k, $('petname').value.trim() || PLANTS[k].pet); tab = 'act';
    $('pick').hidden = true; $('end').hidden = true; $('game').hidden = false; $('hud').hidden = false;
    renderAll(); window.scrollTo({ top: 0 });
    showInfo('1주차', `${esc(G.pet)}와 함께하는 12주`, `<ul class="lines">
      <li>매주 <b>행동력 3</b>으로 물 주기, 관찰, 조사, 화분 옮기기, 아르바이트 등을 골라요.</li>
      <li>물과 양분 수치는 <b>관찰</b>해야 보여요. 좋아하는 범위는 <b>도서관 조사</b>로 알아내요.</li>
      <li>위쪽의 <b>날씨 예보</b>를 보고 대비하세요. 예보는 가끔 틀려요.</li>
      <li>매주 <b>운명의 룰렛</b>이 돌아가고, 4주차에는 <b>인생 갈림길</b>이 기다려요.</li></ul>
      <p class="tip"><b>첫 주 팁</b>먼저 화분 자리를 정하고, 흙을 관찰해 보세요.</p>`);
  }

  document.addEventListener('click', ev => {
    const t = ev.target.closest('button'); if (!t || t.disabled) return;
    const d = t.dataset;
    if (d.m !== undefined) {
      if (d.m === 'x') return closeModal();
      if (d.m === 'spin') return onModal.spin();
      if (d.m === 'next') return onModal.next();
      return onModal.pick && onModal.pick(isNaN(+d.m) ? d.m : +d.m);
    }
    if (d.plant) return start(d.plant);
    if (d.tab) { tab = d.tab; return renderTab(); }
    if (d.act) { const a = actionsFor(G).find(x => x.id === d.act); if (a.opts) showOptions(a); else { doAction(G, a); renderAll(); } return; }
    if (d.buy) { buy(G, d.buy); return renderAll(); }
    if (t.hasAttribute('data-endweek')) return showSummary(endWeek(G));
    if (t.hasAttribute('data-again')) return start(G.k);
    if (t.hasAttribute('data-home')) { $('end').hidden = true; $('pick').hidden = false; renderPick(); }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('modal').hidden && $('sheet').querySelector('[data-m="x"]')) closeModal(); });

  renderPick();
})();
</script>
